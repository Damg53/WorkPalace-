services:
  - type: web
    name: workpalace-backend
    runtime: node
    buildCommand: npm ci
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PASSWORD_RESET_TEST_MODE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://work-palace.vercel.app
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
