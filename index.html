<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link id="page-favicon" rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="256x256" />
    <link rel="apple-touch-icon" href="/workpalace-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f4f6" />
    <script>
      const savedTheme = localStorage.getItem('theme-mode') === 'dark' ? 'dark' : 'light';
      document.documentElement.dataset.theme = savedTheme;
      document.querySelector('meta[name="theme-color"]').content =
        savedTheme === 'dark' ? '#1a1a1a' : '#f3f4f6';
    </script>
    <title>WorkPalace - Tu Plataforma Colaborativa Moderna</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
